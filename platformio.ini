; vesc-esp01-wifi-bridge
; ESP-01 (ESP8266) WiFi <-> VESC UART bridge for VESC Tool (Connection > TCP).
;
; Set your own network name and password below before building.
; The build stops with an error while the password is still CHANGE_ME.

[env:esp01]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_speed = 115200
monitor_speed = 115200

build_flags =
    -DWIFI_SSID=\"VESC-Bridge\"
    -DWIFI_PASS=\"CHANGE_ME\"        ; 8-63 characters. Anyone who knows it can change your ESC settings.
    -DWIFI_TX_DBM=10.0               ; transmit power, 0-20.5 dBm. 10 is plenty for a phone on the handlebar.
    -DVESC_BAUD=115200               ; must match VESC Tool > App Settings > UART
    -DTCP_PORT=65102                 ; VESC Tool's default TCP port
