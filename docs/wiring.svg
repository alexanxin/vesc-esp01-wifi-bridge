<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Helvetica, Arial, sans-serif">
  <title>VESC UART to ESP-01 wiring</title>
  <rect width="760" height="410" fill="#ffffff"/>
  <text x="380" y="32" font-size="16" text-anchor="middle" fill="#222">VESC UART (COMM port) to ESP-01</text>

  <!-- VESC -->
  <rect x="20" y="60" width="160" height="240" rx="8" fill="#f1efe8" stroke="#5f5e5a"/>
  <text x="100" y="82" font-size="14" text-anchor="middle" fill="#222">VESC COMM</text>
  <text x="166" y="104" font-size="13" text-anchor="end" fill="#222">5V</text>
  <text x="166" y="174" font-size="13" text-anchor="end" fill="#222">GND</text>
  <text x="166" y="224" font-size="13" text-anchor="end" fill="#222">TX</text>
  <text x="166" y="264" font-size="13" text-anchor="end" fill="#222">RX</text>

  <!-- regulator -->
  <rect x="250" y="76" width="120" height="48" rx="6" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="310" y="97" font-size="13" text-anchor="middle" fill="#0c447c">AMS1117</text>
  <text x="310" y="114" font-size="12" text-anchor="middle" fill="#0c447c">3.3 V regulator</text>

  <!-- ESP-01 -->
  <rect x="520" y="60" width="220" height="270" rx="8" fill="#eeedfe" stroke="#534ab7"/>
  <text x="630" y="82" font-size="14" text-anchor="middle" fill="#26215c">ESP-01</text>
  <text x="534" y="104" font-size="13" fill="#26215c">VCC</text>
  <text x="534" y="134" font-size="13" fill="#26215c">CH_PD (EN)</text>
  <text x="534" y="174" font-size="13" fill="#26215c">GND</text>
  <text x="534" y="224" font-size="13" fill="#26215c">RX</text>
  <text x="534" y="264" font-size="13" fill="#26215c">TX</text>
  <text x="534" y="304" font-size="13" fill="#26215c">GPIO0: free</text>
  <text x="534" y="320" font-size="11" fill="#534ab7">(to GND only while flashing)</text>

  <!-- 5V to regulator -->
  <line x1="180" y1="100" x2="250" y2="100" stroke="#e24b4a" stroke-width="2.5"/>
  <!-- 3.3V out to VCC and CH_PD -->
  <line x1="370" y1="100" x2="520" y2="100" stroke="#ef9f27" stroke-width="2.5"/>
  <polyline points="480,100 480,130 520,130" fill="none" stroke="#ef9f27" stroke-width="2.5"/>
  <text x="430" y="92" font-size="12" text-anchor="middle" fill="#854f0b">3.3 V</text>
  <!-- GND rail -->
  <line x1="180" y1="170" x2="520" y2="170" stroke="#444441" stroke-width="2.5"/>
  <line x1="310" y1="124" x2="310" y2="170" stroke="#444441" stroke-width="2.5"/>
  <!-- capacitor 3.3V to GND -->
  <line x1="440" y1="100" x2="440" y2="127" stroke="#ef9f27" stroke-width="2"/>
  <line x1="428" y1="128" x2="452" y2="128" stroke="#222" stroke-width="2.5"/>
  <line x1="428" y1="136" x2="452" y2="136" stroke="#222" stroke-width="2.5"/>
  <line x1="440" y1="137" x2="440" y2="170" stroke="#444441" stroke-width="2"/>
  <text x="456" y="152" font-size="12" fill="#222">220 µF (optional)</text>

  <!-- VESC TX -> 1k -> ESP RX -->
  <line x1="180" y1="220" x2="300" y2="220" stroke="#378add" stroke-width="2.5"/>
  <rect x="300" y="212" width="44" height="16" rx="3" fill="#faeeda" stroke="#854f0b"/>
  <text x="322" y="207" font-size="12" text-anchor="middle" fill="#222">1 kΩ (opt.)</text>
  <line x1="344" y1="220" x2="520" y2="220" stroke="#378add" stroke-width="2.5"/>
  <!-- VESC RX <- 1k <- ESP TX -->
  <line x1="180" y1="260" x2="300" y2="260" stroke="#1d9e75" stroke-width="2.5"/>
  <rect x="300" y="252" width="44" height="16" rx="3" fill="#faeeda" stroke="#854f0b"/>
  <text x="322" y="247" font-size="12" text-anchor="middle" fill="#222">1 kΩ (opt.)</text>
  <line x1="344" y1="260" x2="520" y2="260" stroke="#1d9e75" stroke-width="2.5"/>

  <text x="380" y="365" font-size="13" text-anchor="middle" fill="#222">Data lines cross: VESC TX to ESP-01 RX, VESC RX to ESP-01 TX.</text>
  <text x="380" y="388" font-size="13" text-anchor="middle" fill="#a32d2d">Power from the VESC 5 V pin through a regulator, not from the VESC 3.3 V pin.</text>
</svg>
